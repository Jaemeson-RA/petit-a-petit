<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#FFF8EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Petit à petit">
<meta name="format-detection" content="telephone=no">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>Petit à petit</title>
<style>
@font-face{font-family:Nunito;font-weight:500;font-display:swap;src:url(fonts/nunito-v32-latin_latin-ext-500.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:700;font-display:swap;src:url(fonts/nunito-v32-latin_latin-ext-700.woff2) format("woff2")}
@font-face{font-family:Nunito;font-weight:800;font-display:swap;src:url(fonts/nunito-v32-latin_latin-ext-800.woff2) format("woff2")}
@font-face{font-family:Fraunces;font-weight:900;font-display:swap;src:url(fonts/fraunces-v38-latin_latin-ext-900.woff2) format("woff2")}

:root{
  --bg:#FFF8EE; --card:#FFFFFF; --ink:#1E2A3A; --muted:#6B7385; --line:#EADFCB; --soft:#F6EEDF;
  --blue:#2E5BFF; --blue-d:#1D3FC4; --blue-s:#E4EAFF;
  --green:#21A35B; --green-d:#167A43; --green-s:#DDF5E7;
  --red:#E5484D; --red-d:#B5323A; --red-s:#FDE3E3;
  --orange:#FF9F1C; --orange-d:#D67D00; --yellow:#FFC93C;
  --purple:#7B5CFF; --purple-d:#5A3ED6; --purple-s:#ECE7FF;
  --u:#2E5BFF; --u-d:#1D3FC4;
  --r:18px; --shadow:0 2px 0 var(--line);
  --title:Fraunces, Georgia, serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:500 16px/1.45 Nunito,system-ui,sans-serif;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;overflow:hidden;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;padding:0;cursor:pointer}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fr{font-weight:800;color:var(--blue-d)}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden}

/* ---------- écrans ---------- */
/* iPhone : on reste hors de l'encoche et de la barre d'accueil */
.screen{position:absolute;top:env(safe-area-inset-top,0px);bottom:env(safe-area-inset-bottom,0px);left:env(safe-area-inset-left,0px);right:env(safe-area-inset-right,0px);display:none;flex-direction:column;background:var(--bg)}
.screen.active{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:scale(1);opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- boutons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;border-radius:16px;font-weight:800;font-size:16px;letter-spacing:.02em;text-transform:uppercase;background:var(--card);border:2px solid var(--line);box-shadow:0 4px 0 var(--line);transition:transform .08s, box-shadow .08s, filter .15s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 4px 0 var(--blue-d)}
.btn.primary:active{box-shadow:0 1px 0 var(--blue-d)}
.btn.green{background:var(--green);color:#fff;border-color:var(--green);box-shadow:0 4px 0 var(--green-d)}
.btn.redb{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.danger{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 4px 0 var(--red-d)}
.btn.purple{background:var(--purple);color:#fff;border-color:var(--purple);box-shadow:0 4px 0 var(--purple-d)}
.btn.ghost{background:transparent;border-color:transparent;box-shadow:none;color:var(--muted)}
.btn.light{color:#fff}
.btn:disabled{background:#E9E2D4;border-color:#E9E2D4;color:#A9A194;box-shadow:0 4px 0 #D9D0BF;pointer-events:none}
.btn.wide{width:100%}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--muted)}
.icon-btn.light{color:#fff}
.icon-btn:active{background:rgba(0,0,0,.06)}

/* ---------- barre du haut ---------- */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 16px 8px;border-bottom:2px solid var(--line);background:var(--bg);z-index:3}
.brand{display:flex;align-items:center;gap:8px;font-family:var(--title);font-size:19px}
.brand b{font-weight:900}
.piaf-mini svg{width:34px;height:34px;display:block}
.stats{display:flex;align-items:center;gap:12px}
.stat{display:flex;align-items:center;gap:4px;font-weight:800}
.stat.streak{color:var(--orange)} .stat.streak.off{color:#C9BFAE}
.stat.xp{color:var(--blue)}
.stat .ic{width:22px;height:22px}
.stat.streak .ic{fill:currentColor;stroke:var(--orange-d);stroke-width:1.4}
.stat.streak.off .ic{stroke:#B6AC9A}
.stat.xp .ic{fill:var(--yellow);stroke:var(--orange-d);stroke-width:1.4}
.goal{position:relative;width:34px;height:34px;display:grid;place-items:center;color:var(--green)}
.goal>svg:first-child{position:absolute;inset:0;transform:rotate(-90deg)}
.goal circle{fill:none;stroke-width:4}
.g-bg{stroke:var(--line)} .g-fg{stroke:var(--green);stroke-linecap:round;stroke-dasharray:94.25;stroke-dashoffset:94.25;transition:stroke-dashoffset .6s}
.goal .ic{width:16px;height:16px}

/* ---------- onglets ---------- */
.tabs{flex:1;position:relative;overflow:hidden}
.tab{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:16px 16px 28px;display:none;-webkit-overflow-scrolling:touch}
.tab.active{display:block;animation:fadeIn .2s ease}
.tabbar{display:flex;border-top:2px solid var(--line);background:var(--bg);padding:6px 6px 8px}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:14px;color:#A39A8A;font-size:12px;font-weight:800;border:2px solid transparent}
.tabbar button .ic{width:26px;height:26px}
.tabbar button.active{color:var(--blue);background:var(--blue-s);border-color:#C9D5FF}

/* ---------- accueil / chemin ---------- */
.hello{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.hello .piaf svg{width:74px;height:74px;animation:bob 3s ease-in-out infinite}
.hello .piaf{cursor:pointer}
/* Piaf : clignement, saut, ailes, mine triste */
.piaf svg{overflow:visible}
.piaf .pf-eyes{transform-box:fill-box;transform-origin:center;animation:blink 3.8s infinite}
.piaf .pf-wl{transform-box:fill-box;transform-origin:100% 20%}
.piaf .pf-wr{transform-box:fill-box;transform-origin:0% 20%}
.piaf.flap .pf-wl{animation:flapL .22s ease-in-out 4 alternate}
.piaf.flap .pf-wr{animation:flapR .22s ease-in-out 4 alternate}
.piaf.party .pf-wl{animation:flapL .25s ease-in-out infinite alternate}
.piaf.party .pf-wr{animation:flapR .25s ease-in-out infinite alternate}
.piaf.jump svg{animation:jump .6s cubic-bezier(.3,1.6,.5,1)}
.piaf.party svg{animation:pop .5s ease, hop 1s .5s ease-in-out infinite}
.piaf.droop svg{animation:droop .5s ease forwards}
@keyframes flapL{to{transform:rotate(28deg)}}
@keyframes flapR{to{transform:rotate(-28deg)}}
@keyframes jump{0%{transform:translateY(0) scale(1)}35%{transform:translateY(-16px) scale(1.06)}70%{transform:translateY(0) scale(.96,1.04)}100%{transform:none}}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes droop{0%{transform:none}40%{transform:rotate(-8deg)}100%{transform:rotate(-4deg) translateY(3px)}}
.fb-inner{position:relative}
.fb-piaf{position:absolute;right:14px;top:-46px}
.fb-piaf svg{width:68px;height:68px;display:block}
.feedback:not(.show) .fb-piaf{opacity:0}
/* illustrations du vocabulaire */
.vic{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--blue-s);color:var(--blue);flex:none}
.vic .ic{width:19px;height:19px}
.vchip{flex-direction:row;align-items:center;gap:10px}
.vchip>div{display:flex;flex-direction:column;min-width:0}
.word .vic{margin-right:-2px}
.imgs{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.imgcard{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 8px 14px;border:2px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:800;font-size:17px;transition:transform .08s}
.imgcard:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.imgcard .art{width:78px;height:78px;border-radius:22px;display:grid;place-items:center;color:#fff}
.imgcard .art .ic{width:46px;height:46px;stroke-width:1.9}
.imgcard.sel{border-color:#8FA7FF;background:var(--blue-s);box-shadow:0 4px 0 #8FA7FF}
.imgcard.right{border-color:var(--green);background:var(--green-s);box-shadow:0 4px 0 var(--green)}
.imgcard.wrong{border-color:var(--red);background:var(--red-s);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.bubble{position:relative;flex:1;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:10px 14px;box-shadow:var(--shadow)}
.bubble:before{content:"";position:absolute;left:-9px;top:24px;width:14px;height:14px;background:var(--card);border-left:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.bubble small{display:block;color:var(--muted);font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.bubble .pdj{display:flex;align-items:center;gap:8px;margin-top:2px}
.bubble .pdj b{font-weight:800;color:var(--blue-d);font-size:17px}
.bubble .pdj-es{color:var(--muted);font-size:14px}
.say{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--blue);color:#fff;box-shadow:0 3px 0 var(--blue-d);flex:none}
.say:active{transform:translateY(2px);box-shadow:0 1px 0 var(--blue-d)}
.say .ic{width:19px;height:19px}

.continue-card{display:flex;align-items:center;gap:12px;background:var(--u);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:22px;box-shadow:0 4px 0 var(--u-d);width:100%;text-align:left}
.continue-card:active{transform:translateY(3px);box-shadow:0 1px 0 var(--u-d)}
.continue-card .cc-ico{width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.2);display:grid;place-items:center}
.continue-card .cc-ico .ic{width:28px;height:28px}
.continue-card small{opacity:.85;font-weight:700;font-size:12.5px;text-transform:uppercase;letter-spacing:.05em}
.continue-card b{display:block;font-size:18px;font-weight:800}
.continue-card .go{margin-left:auto}

.unit{margin-bottom:34px}
.unit-head{background:var(--u);color:#fff;border-radius:var(--r);padding:14px 16px;box-shadow:0 4px 0 var(--u-d);display:flex;align-items:center;gap:12px;position:sticky;top:-16px;z-index:2}
.unit-head small{font-weight:800;opacity:.85;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.unit-head h2{margin:0;font-family:var(--title);font-weight:900;font-size:22px;line-height:1.15}
.unit-head p{margin:2px 0 0;font-size:13.5px;opacity:.9}
.unit-head .u-guide{margin-left:auto;width:46px;height:46px;border-radius:14px;border:2px solid rgba(255,255,255,.35);display:grid;place-items:center;flex:none}
.unit-head .u-guide:active{background:rgba(255,255,255,.15)}
.path{position:relative;display:flex;flex-direction:column;align-items:center;padding:44px 0 4px;gap:18px}
.node{position:relative;width:76px;height:70px;display:flex;flex-direction:column;align-items:center}
.node .disc{width:72px;height:64px;border-radius:50%;background:var(--u);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 var(--u-d);transition:transform .08s,box-shadow .08s}
.node .disc .ic{width:32px;height:32px;stroke-width:2.4}
.node:active .disc{transform:translateY(5px);box-shadow:0 2px 0 var(--u-d)}
.node.locked .disc{background:#E5DDCD;color:#B3A993;box-shadow:0 7px 0 #CFC5B1}
.node.done .disc{background:var(--yellow);color:#8A5A00;box-shadow:0 7px 0 #D9A21A}
.node.dialog .disc{border-radius:22px}
.node.review .disc{border-radius:20px;transform:rotate(45deg)}
.node.review .disc .ic{transform:rotate(-45deg)}
.node.review:active .disc{transform:rotate(45deg) translateY(4px)}
.node .stars{position:absolute;bottom:-14px;display:flex;gap:1px}
.node .stars .ic{width:15px;height:15px;fill:#E5DDCD;stroke:#CFC5B1;stroke-width:1.5}
.node .stars .ic.on{fill:var(--yellow);stroke:var(--orange-d)}
.node.current:before{content:"";position:absolute;inset:-9px -7px 0;border-radius:50%;border:4px solid var(--u);opacity:.25;animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.9);opacity:.45}100%{transform:scale(1.25);opacity:0}}
.node .start-tag{position:absolute;top:-38px;white-space:nowrap;background:var(--card);border:2px solid var(--line);color:var(--u);font-weight:800;font-size:13px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px;border-radius:11px;animation:bob 2s ease-in-out infinite;z-index:1}
.node .start-tag:after{content:"";position:absolute;left:50%;bottom:-7px;width:10px;height:10px;margin-left:-5px;background:var(--card);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:rotate(45deg)}
.node-label{position:absolute;top:18px;font-size:12.5px;font-weight:800;color:var(--muted);width:120px;line-height:1.15}
.node-label.r{left:88px;text-align:left}
.node-label.l{right:88px;text-align:right}
.path-end{text-align:center;color:var(--muted);font-weight:700;padding:10px 0 40px}
.path-end .piaf svg{width:90px;height:90px}

/* ---------- cartes génériques ---------- */
.card{background:var(--card);border:2px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.card h3{margin:0 0 6px;font-family:var(--title);font-weight:900;font-size:19px}
.card p{margin:0;color:var(--muted)}
h1.page{font-family:var(--title);font-weight:900;font-size:27px;margin:4px 0 14px}
.prac{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.prac:active{transform:translateY(2px)}
.p-ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;color:#fff;flex:none}
.p-ico .ic{width:30px;height:30px}
.prac b{font-size:17px;font-weight:800;display:block}
.prac span{color:var(--muted);font-size:14px}
.prac .count{margin-left:auto;font-weight:800;color:var(--muted)}
.prac[disabled]{opacity:.5;pointer-events:none}

/* ---------- mots ---------- */
.search{display:flex;align-items:center;gap:8px;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:0 12px;margin-bottom:12px}
.search input{flex:1;border:0;outline:0;background:none;font:inherit;font-weight:700;height:48px;color:var(--ink);-webkit-user-select:text;user-select:text}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:9px 0;border-radius:11px;font-weight:800;color:var(--muted);font-size:14px}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 2px 0 var(--line)}
.wgroup h4{margin:18px 2px 8px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.word{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--card);border:2px solid var(--line);border-radius:14px;margin-bottom:8px;width:100%;text-align:left}
.word:active{background:var(--blue-s)}
.word .w-fr{font-weight:800;color:var(--ink)}
.word .w-es{color:var(--muted);font-size:14px}
.word .ic{color:var(--blue);margin-left:auto}
.gtag{font-size:11px;font-weight:800;padding:1px 6px;border-radius:6px;margin-left:6px;vertical-align:2px}
.gtag.m{background:var(--blue-s);color:var(--blue-d)} .gtag.f{background:#FDE4EE;color:#B4235F}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.empty .piaf svg{width:90px;height:90px}

/* ---------- profil ---------- */
.me-head{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.me-head .piaf svg{width:76px;height:76px}
.me-head h1{margin:0;font-family:var(--title);font-weight:900;font-size:27px}
.me-head p{margin:0;color:var(--muted);font-weight:700}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;gap:10px;align-items:center}
.kpi .ic{width:28px;height:28px}
.kpi b{display:block;font-size:20px;font-weight:800;line-height:1.1}
.kpi span{font-size:13px;color:var(--muted);font-weight:700}
.week{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.week .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.week .bar{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:var(--blue-s);min-height:6px;transition:height .5s}
.week .bar.ok{background:var(--blue)}
.week .d span{font-size:12px;font-weight:800;color:var(--muted)}
.week .d.today span{color:var(--blue)}
.set{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--soft)}
.set:first-of-type{border-top:0}
.set div{flex:1}
.set b{display:block;font-weight:800}
.set span{font-size:13.5px;color:var(--muted)}
.switch{width:52px;height:30px;border-radius:30px;background:#DCD3C3;position:relative;transition:background .2s;flex:none}
.switch:after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 2px 3px rgba(0,0,0,.2);transition:transform .2s}
.switch.on{background:var(--green)} .switch.on:after{transform:translateX(22px)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:7px 12px;border-radius:12px;border:2px solid var(--line);font-weight:800;font-size:14px;background:var(--card)}
.chip.on{border-color:var(--blue);background:var(--blue-s);color:var(--blue-d)}
.foot-note{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}

/* ---------- présentation de leçon ---------- */
.sheet{overflow-y:auto}
.intro-head{background:var(--u);color:#fff;padding:14px 16px 22px;position:relative}
.intro-head .icon-btn{color:#fff;margin-left:-8px}
.intro-head small{font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-size:12.5px}
.intro-head h1{margin:2px 0 0;font-family:var(--title);font-weight:900;font-size:28px;line-height:1.12}
.intro-body{padding:16px;flex:1}
.tip{font-size:16.5px;line-height:1.55}
.tip p{margin:0 0 10px}
.tip ul{margin:0 0 10px;padding-left:20px}
.tip li{margin:3px 0}
.tip .fr{cursor:pointer;border-bottom:2px dotted #B9C7FF}
.vthumb{position:relative;display:block;width:100%;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#1E2A3A center/cover no-repeat;margin:4px 0 16px;border:2px solid var(--line)}
.vthumb:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 45%,rgba(0,0,0,.65))}
.vthumb .play{position:absolute;left:50%;top:45%;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;background:#fff;color:var(--red);display:grid;place-items:center;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.3)}
.vthumb .play .ic{width:30px;height:30px;fill:currentColor;margin-left:4px}
.vthumb .vlabel{position:absolute;left:14px;bottom:10px;right:14px;color:#fff;font-weight:800;z-index:1;text-align:left;display:flex;align-items:center;gap:6px}
.vocab-list{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px}
.vchip{display:flex;flex-direction:column;align-items:flex-start;padding:9px 11px;border:2px solid var(--line);border-radius:14px;background:var(--card);text-align:left}
.vchip:active{background:var(--blue-s)}
.vchip b{font-weight:800;color:var(--blue-d);font-size:15px}
.vchip span{font-size:13px;color:var(--muted)}
.intro-foot{position:sticky;bottom:0;padding:12px 16px 16px;background:linear-gradient(180deg,rgba(255,248,238,0),var(--bg) 30%)}
.sec-t{font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin:6px 0 8px}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;padding:10px 12px 6px}
.progress{flex:1;height:16px;border-radius:16px;background:#ECE4D5;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:var(--green);border-radius:16px;transition:width .4s cubic-bezier(.3,1.4,.6,1);box-shadow:inset 0 -4px 0 rgba(0,0,0,.08)}
.combo{min-width:38px;text-align:right;color:var(--orange);font-weight:800;font-size:15px}
.qbody{flex:1;overflow-y:auto;padding:10px 16px 16px;display:flex;flex-direction:column}
.qtype{font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--purple);display:flex;align-items:center;gap:6px;margin-bottom:6px}
.qtype .ic{width:17px;height:17px}
.qtitle{font-family:var(--title);font-weight:900;font-size:24px;line-height:1.2;margin:0 0 16px}
.prompt{display:flex;gap:12px;align-items:flex-start;margin-bottom:18px}
.prompt .piaf svg{width:66px;height:66px;flex:none}
.prompt .bubble{font-size:18px;font-weight:700}
.prompt .bubble:before{top:22px}
.prompt .bubble .line{display:flex;align-items:center;gap:10px}
.big-say{display:flex;gap:14px;justify-content:center;margin:10px 0 22px}
.big-say .say{width:96px;height:96px;border-radius:26px;box-shadow:0 6px 0 var(--blue-d)}
.big-say .say .ic{width:46px;height:46px}
.big-say .say.slow{width:64px;height:64px;border-radius:20px;align-self:flex-end}
.big-say .say.slow .ic{width:30px;height:30px}
.options{display:flex;flex-direction:column;gap:10px}
.options.grid{display:grid;grid-template-columns:1fr 1fr}
.opt{display:flex;align-items:center;gap:12px;min-height:58px;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--card);box-shadow:0 4px 0 var(--line);font-weight:700;font-size:17px;text-align:left;transition:transform .08s}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.opt .k{width:28px;height:28px;border-radius:9px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.opt.sel{border-color:#8FA7FF;background:var(--blue-s);color:var(--blue-d);box-shadow:0 4px 0 #8FA7FF}
.opt.sel .k{border-color:#8FA7FF;color:var(--blue-d)}
.opt.right{border-color:var(--green);background:var(--green-s);color:var(--green-d);box-shadow:0 4px 0 var(--green)}
.opt.wrong{border-color:var(--red);background:var(--red-s);color:var(--red-d);box-shadow:0 4px 0 var(--red);animation:shake .35s}
.answer{min-height:112px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;align-content:flex-start;gap:8px;padding:8px 0 12px;margin-bottom:18px;background:repeating-linear-gradient(180deg,transparent 0 55px,var(--line) 55px 57px)}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tok{min-height:46px;padding:0 14px;border:2px solid var(--line);border-radius:13px;background:var(--card);box-shadow:0 3px 0 var(--line);font-weight:700;font-size:17px;animation:pop .18s ease}
.tok:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.tok.used{background:#ECE4D5;color:transparent;box-shadow:none;border-color:#ECE4D5;pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.match .opt{justify-content:center;text-align:center;font-size:16px;min-height:62px}
.match .opt.gone{opacity:.0;pointer-events:none;transition:opacity .35s .15s}
.fill-sent{font-size:22px;font-weight:700;line-height:1.6;margin:6px 0 24px}
.fill-sent .gap{display:inline-block;min-width:84px;border-bottom:3px solid var(--blue);text-align:center;color:var(--blue-d);margin:0 3px}
.speak-box{display:flex;flex-direction:column;align-items:center;gap:16px;margin-top:6px}
.mic{width:110px;height:110px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;box-shadow:0 7px 0 var(--blue-d);position:relative}
.mic .ic{width:48px;height:48px}
.mic.on{background:var(--red);box-shadow:0 7px 0 var(--red-d)}
.mic.on:before{content:"";position:absolute;inset:-10px;border-radius:50%;border:4px solid var(--red);opacity:.35;transform:scale(var(--lvl,1));transition:transform .08s}
.heard{min-height:28px;color:var(--muted);font-weight:700;text-align:center;font-size:17px}
.heard .ok{color:var(--green-d)} .heard .ko{color:var(--red-d);text-decoration:line-through}
.qfoot{display:flex;gap:10px;padding:12px 16px 16px;border-top:2px solid var(--line)}
.qfoot .btn.primary{flex:1}
.feedback{position:absolute;left:0;right:0;bottom:0;transform:translateY(100%);transition:transform .25s cubic-bezier(.2,.9,.3,1);z-index:5}
.feedback.show{transform:none}
.fb-inner{padding:16px 16px 18px;background:var(--green-s)}
.feedback.bad .fb-inner{background:var(--red-s)}
.fb-head{display:flex;align-items:center;gap:10px;color:var(--green-d);font-size:21px;font-weight:800;margin-bottom:4px}
.feedback.bad .fb-head{color:var(--red-d)}
.fb-ico{width:36px;height:36px;border-radius:50%;background:#fff;display:grid;place-items:center}
.fb-text{color:var(--green-d);font-weight:700;margin-bottom:12px;font-size:16px}
.fb-text .why{display:block;font-weight:600;opacity:.9;margin-top:4px;font-size:15px}
.feedback.bad .fb-text{color:var(--red-d)}
#q-next{width:100%;background:var(--green);border-color:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.feedback.bad #q-next{background:var(--red);border-color:var(--red);box-shadow:0 4px 0 var(--red-d)}
.combo-pop{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--orange);color:#fff;font-weight:800;font-size:22px;padding:10px 18px;border-radius:16px;box-shadow:0 5px 0 var(--orange-d);animation:pop .3s ease;z-index:6;pointer-events:none}

/* ---------- dialogue ---------- */
.dlg-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line)}
.dlg-head b{font-family:var(--title);font-weight:900;font-size:20px;flex:1}
.scene{margin:14px 16px 4px;background:var(--purple-s);border-radius:16px;padding:12px 14px;color:var(--purple-d);font-weight:700;display:flex;gap:10px;align-items:flex-start}
.scene .ic{flex:none;margin-top:2px}
.chat{flex:1;overflow-y:auto;padding:12px 16px 20px;display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:10px;align-items:flex-end;max-width:92%;animation:fadeIn .25s ease}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.ava{width:46px;height:46px;border-radius:50%;flex:none;box-shadow:0 0 0 2px var(--card),0 2px 0 3px var(--line)}
.ava .person,.cast-p .person{width:100%;height:100%;display:block;border-radius:50%}
.person .pp-eyes{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.person .pp-open{opacity:0}
.person.talking .pp-smile{animation:talkA .3s steps(1) infinite}
.person.talking .pp-open{animation:talkB .3s steps(1) infinite}
.person.talking{animation:nod .6s ease-in-out infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.12)}}
@keyframes talkA{0%{opacity:0}50%{opacity:1}}
@keyframes talkB{0%{opacity:1}50%{opacity:0}}
@keyframes nod{0%,100%{transform:rotate(0)}50%{transform:rotate(-3deg) translateY(-1px)}}
.cast{display:flex;justify-content:center;gap:18px;padding:14px 16px 0}
.cast-p{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12.5px;font-weight:800;color:var(--muted);transition:transform .25s}
.cast-p .person{width:72px;height:72px;box-shadow:0 0 0 3px var(--card),0 3px 0 4px var(--line);transition:box-shadow .25s}
.cast-p.on{transform:translateY(-4px);color:var(--purple-d)}
.cast-p.on .person{box-shadow:0 0 0 3px var(--card),0 3px 0 5px var(--purple)}
.mb{background:var(--card);border:2px solid var(--line);border-radius:18px 18px 18px 6px;padding:9px 13px;box-shadow:var(--shadow);text-align:left}
.msg.me .mb{border-radius:18px 18px 6px 18px;background:var(--blue-s);border-color:#C9D5FF}
.mb .who{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.mb .t{font-weight:700;font-size:17px}
.mb .es{color:var(--muted);font-size:14.5px;margin-top:3px;display:none}
.mb.show-es .es{display:block}
.mb.playing{border-color:var(--purple)}
.mb.yourturn{border-style:dashed;border-color:var(--purple);background:#fff}
.dlg-foot{padding:12px 16px 16px;border-top:2px solid var(--line);display:flex;gap:10px;align-items:center}
.dlg-foot .btn{flex:1}
.hint{font-size:13px;color:var(--muted);text-align:center;padding:0 16px 6px}

/* ---------- résultats ---------- */
.done-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.done-wrap .piaf svg{width:150px;height:150px;animation:pop .5s ease}
.done-wrap h1{font-family:var(--title);font-weight:900;font-size:30px;margin:10px 0 4px;color:var(--orange)}
.done-wrap p{margin:0 0 20px;color:var(--muted);font-weight:700}
.res{display:flex;gap:10px;width:100%;max-width:400px}
.res>div{flex:1;border-radius:16px;border:2px solid;overflow:hidden;animation:pop .4s ease both}
.res>div:nth-child(2){animation-delay:.1s} .res>div:nth-child(3){animation-delay:.2s}
.res small{display:block;color:#fff;font-weight:800;font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:4px}
.res b{display:flex;align-items:center;justify-content:center;gap:5px;background:#fff;padding:12px 4px;font-size:20px;font-weight:800}
.res b .ic{width:20px;height:20px}
.res .r1{border-color:var(--yellow);background:var(--yellow)} .res .r1 b{color:var(--orange-d)}
.res .r2{border-color:var(--green);background:var(--green)} .res .r2 b{color:var(--green-d)}
.res .r3{border-color:var(--blue);background:var(--blue)} .res .r3 b{color:var(--blue-d)}
.done-stars{display:flex;gap:6px;justify-content:center;margin:6px 0 4px}
.done-stars .ic{width:40px;height:40px;fill:#E5DDCD;stroke:#CFC5B1;stroke-width:1.4;animation:pop .4s ease both}
.done-stars .ic.on{fill:var(--yellow);stroke:var(--orange-d)}
.done-stars .ic:nth-child(2){animation-delay:.15s} .done-stars .ic:nth-child(3){animation-delay:.3s}
.done-foot{padding:16px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.confetti i{position:absolute;top:-12px;width:9px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* ---------- modales ---------- */
.modal{position:absolute;inset:0;padding-top:max(16px,env(safe-area-inset-top))!important;background:rgba(20,26,38,.72);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;animation:fadeIn .2s}
.video-box{width:100%;display:flex;flex-direction:column;gap:10px}
.video-head{display:flex;align-items:center;color:#fff;gap:8px}
.video-head b{flex:1;font-weight:800}
.video-frame{width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
.video-frame iframe{width:100%;height:100%;border:0}
.confirm-box{background:var(--card);border-radius:20px;padding:20px;width:100%;max-width:380px}
.confirm-box p{margin:0 0 16px;font-weight:700;font-size:17px}
.confirm-box .row{display:flex;gap:10px}
.confirm-box .btn{flex:1}
.toast{position:absolute;left:50%;bottom:96px;transform:translate(-50%,20px);background:var(--ink);color:#fff;padding:10px 16px;border-radius:14px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:30;max-width:88%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---------- jeu : vies, croissants, défis, boutique, coffres, badges ---------- */
@media (max-width:430px){.brand b{display:none}}
.stat.coins{color:#B4690E} .stat.coins .ic{stroke:#B4690E;fill:#FFD98A;stroke-width:1.6}
.stat.hearts{color:var(--red)} .stat.hearts .ic{fill:var(--red);stroke:var(--red-d);stroke-width:1.4}
.qbar .stat.hearts{font-size:17px}
.tabbar button{position:relative;font-size:11.5px}
.tabbar button.dot:after{content:"";position:absolute;top:4px;right:calc(50% - 20px);width:11px;height:11px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.npc{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.npc-art{width:84px;height:84px;flex:none;border-radius:50%;box-shadow:0 0 0 3px var(--card),0 3px 0 4px var(--line)}
.npc-art .person{width:100%;height:100%;display:block;border-radius:50%}
.npc .bubble{font-weight:700}
.npc .bubble:before{top:30px}
.coin-txt{color:#B4690E;white-space:nowrap}
.coin-txt .ic,.q-rew .ic,.buy .ic,.perk .ic,.big-coins .ic{width:18px;height:18px;vertical-align:-3px}
.animal .an-tongue{transform-box:fill-box;transform-origin:top;animation:pant 1.1s ease-in-out infinite}
@keyframes pant{50%{transform:scaleY(1.25)}}
.quest,.shop-item{display:flex;align-items:center;gap:12px}
.q-ico{width:46px;height:46px;border-radius:14px;background:var(--purple-s);color:var(--purple-d);display:grid;place-items:center;flex:none}
.quest.bonus .q-ico{background:#FFF0C9;color:#B4690E}
.quest.claimed{opacity:.6} .quest.claimed .q-ico{background:var(--green-s);color:var(--green-d)}
.q-main{flex:1;min-width:0}
.q-main b{display:block;font-weight:800}
.q-main>span{color:var(--muted);font-size:13.5px}
.q-bar{position:relative;height:18px;border-radius:18px;background:#ECE4D5;overflow:hidden;margin-top:6px}
.q-bar i{display:block;height:100%;background:var(--yellow);border-radius:18px;transition:width .5s}
.q-bar span{position:absolute;inset:0;text-align:center;font-size:12px;font-weight:800;line-height:18px;color:var(--ink)}
.q-rew{font-weight:800;color:#B4690E;white-space:nowrap;display:flex;align-items:center;gap:4px}
.q-claim,.buy{min-height:42px;padding:0 14px;font-size:14px;flex:none}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px}

.badge small{font-size:11.5px;color:var(--muted);line-height:1.2}

.node.chest{height:62px}

.node.chest.done .disc{background:#F3E9D2;color:#C9A44A;box-shadow:0 6px 0 #E2D3AE}
@keyframes wiggle{0%,60%,100%{transform:rotate(0)}70%{transform:rotate(-7deg)}80%{transform:rotate(7deg)}90%{transform:rotate(-4deg)}}
.pop-box{background:var(--card);border-radius:22px;padding:22px 18px 18px;width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;animation:pop .3s ease}
.pop-box h2{margin:0;font-family:var(--title);font-weight:900;font-size:24px}
.pop-box p{margin:0;color:var(--muted);font-weight:700}
.pop-box .piaf svg{width:96px;height:96px}
.chest-art{width:96px;height:96px;border-radius:28px;background:var(--yellow);color:#8A5A00;display:grid;place-items:center;box-shadow:0 6px 0 #D9A21A;animation:pop .45s ease}
.chest-art .ic{width:54px;height:54px}
.badge-art{border-radius:50%}
.big-coins{font-size:24px!important;color:#B4690E!important;font-weight:800!important}
.big-coins .ic{width:26px;height:26px;vertical-align:-5px}
.perks{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.perk{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:12px;font-weight:800;font-size:15px;background:var(--soft);animation:pop .4s ease both;animation-delay:.3s}
.perk.coin{background:#FFF0C9;color:#B4690E} .perk.heart{background:var(--red-s);color:var(--red-d)}
.perk.boost{background:var(--purple-s);color:var(--purple-d)} .perk.goalp{background:var(--green-s);color:var(--green-d)} .perk.quest{background:var(--blue-s);color:var(--blue-d)}
.streak-card{margin-top:16px;background:#FFF0D6;border:2px solid #FFD79A;border-radius:18px;padding:12px 16px;width:100%;max-width:400px;animation:pop .45s ease both;animation-delay:.45s}
.streak-card b{display:flex;align-items:center;justify-content:center;gap:6px;color:var(--orange-d);font-size:18px}

.sweek{display:flex;justify-content:space-between;margin-top:10px}

.combo-pop{display:flex;align-items:center;gap:10px;text-align:left;white-space:nowrap}
.combo-pop small{display:block;font-size:13px;font-weight:700;opacity:.95}
.cp-art{width:54px;height:54px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #fff}
.cp-art .person{width:100%;height:100%;display:block;border-radius:50%}

<div id="app">
  <!-- ===== Écran principal (onglets) ===== -->
  <section id="home" class="screen active">
    <header class="topbar">
      <div class="brand"><span class="piaf-mini" data-piaf="mini"></span><b>Petit à petit</b></div>
      <div class="stats">
        <span class="stat streak" id="st-streak" title="Racha"><svg class="ic"><use href="#i-flame"/></svg><b>0</b></span>
        <span class="stat coins" id="st-coins" title="Croissants"><svg class="ic"><use href="#i-croissant"/></svg><b>0</b></span>
        <span class="stat hearts" id="st-hearts" title="Vidas"><svg class="ic"><use href="#i-heart"/></svg><b>5</b></span>
        <span class="goal" id="st-goal" title="Meta del día"><svg viewBox="0 0 36 36"><circle cx="18" cy="18" r="15" class="g-bg"/><circle cx="18" cy="18" r="15" class="g-fg"/></svg><svg class="ic"><use href="#i-target"/></svg></span>
      </div>
    </header>

    <main class="tabs">
      <div class="tab active" id="tab-learn"></div>
      <div class="tab" id="tab-practice"></div>
      <div class="tab" id="tab-words"></div>
      <div class="tab" id="tab-quests"></div>
      <div class="tab" id="tab-shop"></div>
      <div class="tab" id="tab-me"></div>
    </main>

    <nav class="tabbar">
      <button data-tab="learn" class="active"><svg class="ic"><use href="#i-map"/></svg><span>Aprender</span></button>
      <button data-tab="practice"><svg class="ic"><use href="#i-dumbbell"/></svg><span>Práctica</span></button>
      <button data-tab="quests"><svg class="ic"><use href="#i-gift"/></svg><span>Desafíos</span></button>
      <button data-tab="shop"><svg class="ic"><use href="#i-store"/></svg><span>Tienda</span></button>
      <button data-tab="me"><svg class="ic"><use href="#i-user-round"/></svg><span>Yo</span></button>
    </nav>
  </section>

  <!-- ===== Présentation d'une leçon ===== -->
  <section id="intro" class="screen sheet"></section>

  <!-- ===== Exercices ===== -->
  <section id="quiz" class="screen">
    <header class="qbar">
      <button class="icon-btn" id="q-close" aria-label="Salir"><svg class="ic"><use href="#i-x"/></svg></button>
      <div class="progress"><i id="q-prog"></i></div>
      <span class="combo" id="q-combo"></span>
      <span class="stat hearts" id="q-hearts" hidden><svg class="ic"><use href="#i-heart"/></svg><b>5</b></span>
    </header>
    <div class="qbody" id="q-body"></div>
    <footer class="qfoot" id="q-foot">
      <button class="btn ghost" id="q-skip" hidden>No puedo hablar ahora</button>
      <button class="btn primary" id="q-check" disabled>Comprobar</button>
    </footer>
    <div class="feedback" id="q-fb">
      <div class="fb-inner"><span class="fb-piaf piaf"></span>
        <div class="fb-head"><span class="fb-ico"></span><b class="fb-title"></b></div>
        <div class="fb-text"></div>
        <button class="btn" id="q-next">Continuar</button>
      </div>
    </div>
  </section>

  <!-- ===== Dialogue ===== -->
  <section id="dlg" class="screen"></section>

  <!-- ===== Résultats ===== -->
  <section id="done" class="screen"></section>

  <!-- ===== Vidéo ===== -->
  <div id="video" class="modal" hidden>
    <div class="video-box">
      <div class="video-head"><b id="v-title"></b><button class="icon-btn light" id="v-close" aria-label="Cerrar"><svg class="ic"><use href="#i-x"/></svg></button></div>
      <div class="video-frame" id="v-frame"></div>
      <button class="btn ghost light" id="v-yt"><svg class="ic"><use href="#i-external-link"/></svg> Abrir en YouTube</button>
    </div>
  </div>

  <div id="pop" class="modal" hidden><div class="pop-box" id="pop-box"></div></div>
  <div id="toast" class="toast"></div>
  <div id="confirm" class="modal" hidden>
    <div class="confirm-box"><p id="c-text"></p><div class="row"><button class="btn ghost" id="c-no">Cancelar</button><button class="btn danger" id="c-yes">Sí</button></div></div>
  </div>
</div>

<script src="content.js"></script>
<script src="people.js"></script>
<script src="app.js"></script>
</body>
</html>
